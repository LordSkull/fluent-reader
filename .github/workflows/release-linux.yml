name: CI/CD Release Linux

on:
    release:
        types:
            - published
    workflow_dispatch:
        inputs:
            tag:
                description: Existing release tag to build
                required: true
                type: string

permissions:
    contents: write

jobs:
    release-linux:
        runs-on: ubuntu-latest
        env:
            RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ env.RELEASE_TAG }}

            - uses: actions/setup-node@v7
              with:
                  node-version: "24"
                  package-manager-cache: false

            - name: Verify release exists
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null

            - name: Select npm
              run: npm install --global npm@11.19.1

            # npm 11.19.1 enforces "allowScripts", which skips node-gyp for
            # better-sqlite3. Stop before installing anything if the toolchain
            # does not match package.json.
            - name: Verify Node.js and npm
              shell: bash
              run: |
                  node --version
                  npm --version
                  NPM_VERSION="$(npm --version)" node -e '
                      const { engines } = require("./package.json")
                      const node = engines.node.match(/^\^(\d+)\./)[1]
                      if (process.versions.node.split(".")[0] !== node)
                          throw new Error(`Node.js ${process.version} does not match ${engines.node}`)
                      if (process.env.NPM_VERSION !== engines.npm)
                          throw new Error(`npm ${process.env.NPM_VERSION} does not match ${engines.npm}`)
                  '

            - name: Install dependencies
              run: npm ci

            - name: Verify article integrity
              run: npm run check:article-integrity

            - name: Build and package the app
              run: |
                  npm run build
                  npm run package-linux

            - name: Upload AppImage to release assets
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  version="$(node -p "require('./package.json').version")"
                  asset_path="$RUNNER_TEMP/Fluent.Reader.$version.AppImage"
                  cp "./bin/linux/x64/Fluent Reader-$version.AppImage" "$asset_path"
                  gh release upload "$RELEASE_TAG" "$asset_path" --repo "$GITHUB_REPOSITORY" --clobber
